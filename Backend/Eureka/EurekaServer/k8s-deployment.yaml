apiVersion: apps/v1
kind: Deployment
metadata:
  name: evermind-eureka
spec:
  replicas: 1 # Eureka usually only needs 1 instance in a home lab
  selector:
    matchLabels:
      app: evermind-eureka
  template:
    metadata:
      labels:
        app: evermind-eureka
    spec:
      containers:
      - name: eureka
        image: azizesp/evermind-eureka:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8761
---
apiVersion: v1
kind: Service
metadata:
  # IMPORTANT: This name becomes the internal DNS name for your cluster!
  name: evermind-eureka-service 
spec:
  type: NodePort
  selector:
    app: evermind-eureka
  ports:
    - protocol: TCP
      port: 8761        # The port other pods will use to talk to Eureka
      targetPort: 8761  # Maps down to the Spring Boot server
      nodePort: 32761   # The external port for you to view the dashboard